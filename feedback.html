<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Feedback | CareerPrep</title>
  <meta name="description" content="Sample student testimonials and a feedback form.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3l17 9.8v19.4L24 42 7 32.200V12.800z' fill='%2314b8a6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero"><div class="container">
      <div class="breadcrumbs"><a href="index.html">Home</a> / Student Feedback</div>
      <h1>Student Feedback</h1>
      <p>Read sample testimonials and share your own feedback about the platform.</p>
    </div></section>
    <section class="section" style="padding-top:36px"><div class="container">
      <div id="notice" style="margin-bottom:22px"></div>
      <div class="grid" style="grid-template-columns:1.6fr 1fr;align-items:start" id="fbLayout">
        <div id="fbList" class="grid grid-2"></div>
        <div id="fbForm"></div>
      </div>
    </div></section>
    <style>@media(max-width:900px){#fbLayout{grid-template-columns:1fr!important}}@media(max-width:640px){#fbList{grid-template-columns:1fr}}</style>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script>
    CP.boot({ active: "" });
    document.getElementById("notice").innerHTML = '';
    var draw = function () { CP.Views.testimonials(document.getElementById("fbList")); };
    CP.Views.feedbackForm(document.getElementById("fbForm"), draw);
    draw();
  </script>
</body>
</html>
