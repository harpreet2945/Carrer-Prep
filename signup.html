<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up | CareerPrep</title>
  <meta name="description" content="Join CareerPrep and start building your career.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M24 3l17 9.8v19.4L24 42 7 32.200V12.800z' fill='%2314b8a6'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <div class="auth-wrap"><div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Join CareerPrep and start building your career.</p>
      <div id="formMsg" class="err" role="alert" style="margin-bottom:10px;font-size:.85rem"></div>
      <form id="authForm" novalidate>
        <div class="field"><label for="name">Full name <span class="req">*</span></label><input class="input" id="name" name="name" autocomplete="name"><span class="err" data-err="name"></span></div>
        <div class="field"><label for="email">Email <span class="req">*</span></label><input class="input" id="email" name="email" type="email" autocomplete="email"><span class="err" data-err="email"></span></div>
        <div class="field"><label for="password">Password <span class="req">*</span></label>
          <div class="pw-wrap"><input class="input" id="password" name="password" type="password" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle="password" aria-label="Show password"></button></div>
          <span class="err" data-err="password"></span></div>
        <div class="pw-meter" aria-hidden="true" style="margin:-8px 0 4px"><i id="meter"></i></div><p class="hint" id="meterTxt" style="margin-bottom:16px">Use 8+ characters with a mix of letters and numbers.</p>
        <div class="field"><label for="confirm">Confirm password <span class="req">*</span></label>
          <div class="pw-wrap"><input class="input" id="confirm" name="confirm" type="password" autocomplete="new-password"><button type="button" class="pw-toggle" data-toggle="confirm" aria-label="Show password"></button></div>
          <span class="err" data-err="confirm"></span></div>

        <button class="btn btn-primary btn-block" type="submit" id="submitBtn">Create Account</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="signin.html">Sign in</a></p>
    </div></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/views.js"></script>
  <script>
    CP.boot({ active: "" });
    document.querySelectorAll(".pw-toggle").forEach(function (b) {
      b.innerHTML = CP.icon("eye");
      b.addEventListener("click", function () {
        var i = document.getElementById(b.dataset.toggle), show = i.type === "password";
        i.type = show ? "text" : "password"; b.innerHTML = CP.icon(show ? "eyeoff" : "eye");
        b.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });
    });
    var form = document.getElementById("authForm"), msg = document.getElementById("formMsg"), btn = document.getElementById("submitBtn");
    var pwEl = document.getElementById("password"), meter = document.getElementById("meter"), mt = document.getElementById("meterTxt");
    pwEl.addEventListener("input", function () {
      var v = pwEl.value, s = (v.length >= 8) + /[A-Z]/.test(v) + /[0-9]/.test(v) + /[^A-Za-z0-9]/.test(v) + (v.length >= 12);
      meter.style.width = (s * 20) + "%"; meter.style.background = s < 3 ? "#ff6b6b" : s < 4 ? "#f6a53a" : "#34d399";
      mt.textContent = v ? ["Very weak", "Weak", "Fair", "Good", "Strong", "Strong"][s] : "Use 8+ characters with a mix of letters and numbers.";
    });
    form.addEventListener("submit", async function (e) {
      e.preventDefault(); msg.textContent = "";
      var ok = CP.validate(form, {
        name: { required: true, min: 2 }, email: { required: true, email: true },
        password: { required: true, custom: function (v) { return v.length < 8 ? "Password must be at least 8 characters." : !/[A-Za-z]/.test(v) || !/[0-9]/.test(v) ? "Include both letters and numbers." : ""; } },
        confirm: { required: true, msg: "Please confirm your password.", custom: function (v) { return v !== form.elements.password.value ? "Passwords do not match." : ""; } }
      });
      if (!ok) return;
      btn.disabled = true; btn.textContent = "Creating account…";
      try { await CP.auth.signUp(form.elements.name.value, form.elements.email.value, form.elements.password.value); CP.toast("Account created successfully."); setTimeout(function () { location.href = "dashboard.html"; }, 600); }
      catch (err) { msg.textContent = err.message; btn.disabled = false; btn.textContent = "Create Account"; }
    });
  </script>
</body>
</html>
